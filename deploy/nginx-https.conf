server {
    listen 80;
    listen [::]:80;
    server_name timebank.iranihosts.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://timebank.iranihosts.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name timebank.iranihosts.com;

    ssl_certificate /etc/letsencrypt/live/timebank.iranihosts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timebank.iranihosts.com/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        include /etc/nginx/conf.d/timebank-upstream.inc;
        proxy_pass http://$timebank_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
